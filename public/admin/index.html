<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CMS · Orientación Vocacional</title>
  <style>
    :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e7e9ee; --mut:#9aa0ab; --red:#ff0300; --grn:#25c26e; --blu:#7db6ff; }
    * { box-sizing:border-box; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:var(--bg); color:var(--txt); }
    header { padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    header h1 { font-size:1.05rem; margin:0; }
    .who { color:var(--mut); font-size:.85rem; }
    .who b { color:var(--txt); }
    nav { display:flex; gap:6px; padding:12px 24px 0; flex-wrap:wrap; }
    nav button { background:transparent; border:1px solid transparent; color:var(--mut); padding:9px 16px; border-radius:9px 9px 0 0; cursor:pointer; font-size:.92rem; }
    nav button.active { color:var(--txt); background:var(--panel); border-color:var(--line); border-bottom-color:var(--panel); }
    .wrap { padding:20px 24px 40px; }
    .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:120px; }
    .stat .n { font-size:1.5rem; font-weight:700; }
    .stat .l { color:var(--mut); font-size:.8rem; }
    .bar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    input, select { background:#0f131a; border:1px solid var(--line); color:var(--txt); padding:9px 12px; border-radius:8px; font-size:.9rem; }
    input[type=search]{ min-width:220px; }
    button.btn { background:var(--panel); border:1px solid var(--line); color:var(--txt); padding:9px 14px; border-radius:8px; cursor:pointer; font-size:.9rem; }
    button.btn:hover { border-color:#3a414f; }
    button.pri { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
    table { width:100%; border-collapse:collapse; font-size:.88rem; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--mut); font-weight:600; }
    tr:hover td { background:#12151b; }
    a { color:var(--blu); text-decoration:none; }
    .msg { max-width:340px; white-space:pre-wrap; color:#cfd3db; }
    .src { color:var(--mut); font-size:.78rem; word-break:break-all; }
    .pill { font-size:.72rem; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--mut); }
    .pill.ok { color:var(--grn); border-color:#1e5c3a; }
    .pill.wa { color:#25d366; border-color:#155f34; }
    .pill.web { color:var(--blu); border-color:#274a6e; }
    .empty,.err { padding:36px; text-align:center; color:var(--mut); }
    .err { color:#ff8f8d; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:.78rem; color:var(--mut); }
    .hidden { display:none; }
    .note { color:var(--mut); font-size:.85rem; margin:8px 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>📊 CMS · Orientación Vocacional</h1>
    <div>
      <span class="who" id="who"></span>
      <button class="btn" id="logout" style="margin-left:10px">Salir</button>
    </div>
  </header>
  <nav id="nav">
    <button data-tab="forms" class="active">📋 Formularios</button>
    <button data-tab="agenda">📅 Agenda</button>
    <button data-tab="users" id="tabUsers">👤 Usuarios</button>
  </nav>
  <div class="wrap">
    <!-- ===== Formularios ===== -->
    <section id="tab-forms">
      <div class="cards" id="stats"></div>
      <div class="bar">
        <input type="search" id="q" placeholder="Buscar nombre, email, teléfono, mensaje…">
        <select id="fsource">
          <option value="">Todas las fuentes</option>
          <option value="web">Web</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
        <button class="btn" id="refresh">↻ Actualizar</button>
        <button class="btn" id="csv">⬇ CSV</button>
        <span class="src" id="count"></span>
      </div>
      <div id="forms"><div class="empty">Cargando…</div></div>
    </section>

    <!-- ===== Agenda ===== -->
    <section id="tab-agenda" class="hidden">
      <div class="panel">
        <h3 style="margin:0 0 8px">Agenda · Google Calendar de contacto@</h3>
        <p class="note" id="calStatus">Verificando conexión…</p>
        <div class="row" style="margin-top:14px">
          <button class="btn pri" id="calSync">🔄 Sincronizar agenda</button>
          <span class="src" id="calResult"></span>
        </div>
        <p class="note">Cruza los eventos del calendario con los leads: marca quién se agendó y completa datos faltantes. Requiere la API de Maton cargada en Render.</p>
      </div>
    </section>

    <!-- ===== Usuarios ===== -->
    <section id="tab-users" class="hidden">
      <div class="panel" style="margin-bottom:16px">
        <h3 style="margin:0 0 12px">Crear / actualizar usuario</h3>
        <div class="row">
          <div class="field"><label>Correo</label><input type="email" id="uEmail" placeholder="persona@correo.cl"></div>
          <div class="field"><label>Nombre</label><input type="text" id="uName" placeholder="Nombre"></div>
          <div class="field"><label>Rol</label><select id="uRole"><option value="editor">Editor</option><option value="admin">Admin</option></select></div>
          <div class="field"><label>Contraseña</label><input type="text" id="uPass" placeholder="Contraseña"></div>
          <button class="btn pri" id="uSave">Guardar</button>
        </div>
        <p class="note" id="uMsg"></p>
      </div>
      <div id="users"><div class="empty">Cargando…</div></div>
    </section>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let ME = null, LEADS = [];

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmt(s){ try { return new Date(s).toLocaleString('es-CL',{timeZone:'America/Santiago',dateStyle:'short',timeStyle:'short'}); } catch { return s||''; } }

    async function api(url, opts) {
      const r = await fetch(url, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts||{}));
      if (r.status === 401) { location.href='/login'; throw new Error('401'); }
      return r.json();
    }

    // ---- Tabs ----
    document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#nav button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      ['forms','agenda','users'].forEach(t => $('#tab-'+t).classList.toggle('hidden', t !== b.dataset.tab));
      if (b.dataset.tab === 'users') loadUsers();
      if (b.dataset.tab === 'agenda') loadCal();
    }));

    // ---- Formularios ----
    function renderStats(s){
      if (!s) return;
      $('#stats').innerHTML = [
        ['Total', s.total], ['Web', s.web], ['WhatsApp', s.whatsapp], ['Agendados', s.agendados]
      ].map(([l,n]) => `<div class="stat"><div class="n">${n||0}</div><div class="l">${l}</div></div>`).join('');
    }
    function srcPill(x){ return x==='whatsapp' ? '<span class="pill wa">WhatsApp</span>' : '<span class="pill web">Web</span>'; }
    function renderLeads(rows){
      const c = $('#forms');
      if (!rows.length){ c.innerHTML='<div class="empty">Sin registros.</div>'; $('#count').textContent=''; return; }
      let h = '<table><thead><tr><th>Fecha</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Mensaje</th><th>Fuente</th><th>Origen</th><th>Correo</th><th>Agenda</th></tr></thead><tbody>';
      for (const r of rows) h += `<tr>
        <td>${fmt(r.created_at)}</td><td>${esc(r.name)||'—'}</td>
        <td>${r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:'—'}</td>
        <td>${r.phone?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:'—'}</td>
        <td class="msg">${esc(r.message)||'—'}</td>
        <td>${srcPill(r.source)}</td>
        <td class="src">${esc(r.source_page)||'—'}</td>
        <td>${r.emailed?'<span class="pill ok">✓</span>':'<span class="pill">—</span>'}</td>
        <td>${r.scheduled?'<span class="pill ok">agendado</span>':'<span class="pill">—</span>'}</td>
      </tr>`;
      h += '</tbody></table>';
      c.innerHTML = h;
      $('#count').textContent = rows.length + ' de ' + LEADS.length;
    }
    function applyFilter(){
      const q = $('#q').value.toLowerCase().trim();
      let rows = LEADS;
      if (q) rows = rows.filter(r => [r.name,r.email,r.phone,r.message,r.source_page].join(' ').toLowerCase().includes(q));
      renderLeads(rows);
    }
    async function loadLeads(){
      $('#forms').innerHTML = '<div class="empty">Cargando…</div>';
      try {
        const src = $('#fsource').value;
        const data = await api('/api/leads?limit=2000' + (src?('&source='+src):''));
        LEADS = data.leads || []; renderStats(data.stats); applyFilter();
      } catch(e){ if(e.message!=='401') $('#forms').innerHTML='<div class="err">Error: '+esc(e.message)+'</div>'; }
    }
    function toCSV(){
      const head=['fecha','nombre','email','telefono','mensaje','fuente','origen','correo','agendado'];
      const lines=[head.join(',')];
      for(const r of LEADS){ const c=[fmt(r.created_at),r.name,r.email,r.phone||'',(r.message||'').replace(/\n/g,' '),r.source,r.source_page||'',r.emailed?'si':'no',r.scheduled?'si':'no'];
        lines.push(c.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')); }
      const b=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download='leads-orientacion-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    }
    $('#q').addEventListener('input', applyFilter);
    $('#fsource').addEventListener('change', loadLeads);
    $('#refresh').addEventListener('click', loadLeads);
    $('#csv').addEventListener('click', toCSV);

    // ---- Agenda ----
    async function loadCal(){
      try {
        const s = await api('/api/calendar/status');
        $('#calStatus').innerHTML = s.configured
          ? '✅ Conectado. Calendario: <b>'+esc(s.calendarId)+'</b>'
          : '⚠️ Falta cargar <b>MATON_API_KEY</b> en Render para conectar el calendario.';
      } catch(e){}
    }
    $('#calSync').addEventListener('click', async () => {
      $('#calResult').textContent = 'Sincronizando…';
      try { const r = await api('/api/calendar/sync', { method:'POST', body:'{}' });
        $('#calResult').textContent = r.ok ? `Listo: ${r.matched} agendados de ${r.scanned} eventos.` : ('Error: '+r.error);
      } catch(e){ $('#calResult').textContent='Error: '+esc(e.message); }
    });

    // ---- Usuarios ----
    async function loadUsers(){
      $('#users').innerHTML='<div class="empty">Cargando…</div>';
      try {
        const data = await api('/api/users');
        const rows = data.users||[];
        let h='<table><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Último ingreso</th><th></th></tr></thead><tbody>';
        for(const u of rows) h+=`<tr>
          <td>${esc(u.email)}</td><td>${esc(u.name)||'—'}</td>
          <td>${u.role==='admin'?'<span class="pill ok">admin</span>':'<span class="pill">editor</span>'}</td>
          <td>${u.active?'activo':'inactivo'}</td>
          <td class="src">${u.last_login_at?fmt(u.last_login_at):'—'}</td>
          <td>${u.email===ME.email?'<span class="src">(tú)</span>':`<button class="btn" data-del="${u.id}">Eliminar</button>`}</td>
        </tr>`;
        h+='</tbody></table>';
        $('#users').innerHTML=h;
        $('#users').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async()=>{
          if(!confirm('¿Eliminar este usuario?')) return;
          await api('/api/users/'+b.dataset.del, {method:'DELETE'}); loadUsers();
        }));
      } catch(e){ if(e.message!=='401') $('#users').innerHTML='<div class="err">Error: '+esc(e.message)+'</div>'; }
    }
    $('#uSave').addEventListener('click', async ()=>{
      $('#uMsg').textContent='';
      const body={ email:$('#uEmail').value.trim(), name:$('#uName').value.trim(), role:$('#uRole').value, password:$('#uPass').value };
      if(!body.email||!body.password){ $('#uMsg').textContent='Correo y contraseña son obligatorios.'; return; }
      try { const r=await api('/api/users',{method:'POST',body:JSON.stringify(body)});
        if(r.ok){ $('#uMsg').textContent='✅ Guardado.'; $('#uEmail').value=$('#uName').value=$('#uPass').value=''; loadUsers(); }
        else $('#uMsg').textContent=r.error||'Error.';
      } catch(e){ $('#uMsg').textContent='Error: '+e.message; }
    });

    // ---- Init ----
    (async () => {
      try {
        const m = await api('/api/me'); ME = m.user;
        $('#who').innerHTML = 'Conectado: <b>'+esc(ME.email)+'</b> · '+esc(ME.role);
        if (ME.role !== 'admin') $('#tabUsers').classList.add('hidden');
        loadLeads();
      } catch(e){ if(e.message!=='401') console.error(e); }
    })();
    $('#logout').addEventListener('click', async ()=>{ await api('/api/logout',{method:'POST'}); location.href='/login'; });
  </script>
</body>
</html>
