<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingresar · CMS Orientación Vocacional</title>
  <style>
    :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e7e9ee; --mut:#9aa0ab; --red:#ff0300; }
    * { box-sizing:border-box; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; min-height:100vh;
      display:grid; place-items:center; background:var(--bg); color:var(--txt); }
    form { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px; width:340px; }
    h1 { font-size:1.2rem; margin:0 0 4px; }
    p.sub { color:var(--mut); margin:0 0 22px; font-size:.9rem; }
    label { display:block; font-size:.85rem; color:var(--mut); margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
      background:#0f131a; color:var(--txt); font-size:.95rem; }
    button { width:100%; margin-top:22px; padding:12px; border:0; border-radius:9px; background:var(--red);
      color:#fff; font-weight:600; font-size:.95rem; cursor:pointer; }
    .err { color:#ff8f8d; font-size:.85rem; margin-top:14px; min-height:1em; }
  </style>
</head>
<body>
  <form id="f">
    <h1>CMS · Orientación Vocacional</h1>
    <p class="sub">Ingresa con tu cuenta</p>
    <label>Correo</label>
    <input type="email" id="email" autocomplete="username" required>
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const f = document.getElementById('f');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('err').textContent = '';
      try {
        const resp = await fetch('/api/login', {
          method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
          body: JSON.stringify({ email: email.value.trim(), password: password.value })
        });
        const data = await resp.json();
        if (data.ok) { location.href = '/admin'; }
        else { document.getElementById('err').textContent = data.error || 'No se pudo ingresar.'; }
      } catch (err) { document.getElementById('err').textContent = 'Error de conexión.'; }
    });
  </script>
</body>
</html>
