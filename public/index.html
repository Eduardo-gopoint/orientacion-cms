<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Orientación Vocacional — CMS</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
      min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e7e9ee; }
    .card { max-width: 460px; padding: 40px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #9aa0ab; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 10px;
      background: #ff0300; color: #fff; text-decoration: none; font-weight: 500; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#25c26e; margin-right:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Orientación Vocacional · CMS</h1>
    <p><span class="dot"></span>Servicio activo. Backend de formularios y gestión de leads del sitio.</p>
    <a class="btn" href="/admin">Entrar al panel</a>
  </div>
</body>
</html>
